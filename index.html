<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nubecita Dzn Online ☁️ | Tienda Oficial</title>
<style>
:root{
  --oscuro:#005954;
  --medio:#338b85;
  --boton:#5dc1b9;
  --claro:#9ce0db;
  --blanco:#d5ffff;
  --rojo:#FF4D4D;
  --whatsapp:#25D366
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{color:var(--blanco);text-align:center;min-height:100vh;padding:0;background: var(--oscuro);padding-bottom:80px;}
.box{max-width:500px;margin:20px auto;background:var(--medio);border:1px solid var(--claro);border-radius:16px;padding:25px}
.verificado{background:rgba(93,193,185,0.15);border:1px solid var(--boton);border-radius:12px;padding:15px;margin:15px 20px;text-align:center}
.verificado b{color:var(--blanco);font-size:16px}
.verificado p{color:var(--claro);font-size:13px;margin-top:5px}
.oferta-box{background:rgba(93,193,185,0.15);border:1px solid var(--boton);border-radius:12px;padding:12px;margin-bottom:15px;text-align:center}
.oferta-box b{color:var(--blanco);font-size:14px}
.oferta-box p{color:var(--claro);font-size:12px;margin-top:4px}
header{padding:30px 20px;border-bottom:2px solid var(--boton);background:var(--medio)}
h1{color:var(--blanco);font-size:34px;letter-spacing:2px;text-shadow:0 0 12px var(--boton)}
.slogan{color:var(--claro);margin-top:5px;font-size:14px}
.container{max-width:500px;margin:auto;padding:20px}
.titulo-seccion{font-size:18px;font-weight:bold;color:var(--blanco);margin:20px 0 10px;text-align:left;border-left:3px solid var(--boton);padding-left:10px}
.card{background:var(--medio);border:1px solid var(--claro);border-radius:12px;padding:15px;margin:12px 0;text-align:left;transition:.2s;position:relative;cursor:pointer}
.card:hover{transform:scale(1.02);box-shadow:0 0 15px var(--boton)}
.nombre{font-weight:bold;font-size:16px;display:flex;align-items:center;gap:8px;color:var(--blanco)}
.precio{color:var(--blanco);font-size:18px;font-weight:bold;margin:6px 0}
.badge-img{height:20px;width:auto;border-radius:4px;vertical-align:middle}
.btn{display:block;background:var(--boton);color:var(--oscuro);padding:12px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:15px;margin-top:8px;text-align:center;transition:.2s}
.btn:hover{background:var(--claro)}
.btn-verde{background:var(--whatsapp);color:#fff}
.btn-morado{background:var(--claro);color:var(--oscuro)}
.btn-outline{background:transparent;border:1px solid var(--claro);color:var(--claro)}
.footer{color:var(--claro);font-size:12px;padding:20px;background:var(--medio)}
.sub{color:var(--claro);font-size:14px;margin-bottom:15px}
img.producto-img, img.comandos-img{width:100%;border-radius:12px;margin:15px 0;border:1px solid var(--medio)}
.precio-big{font-size:32px;color:var(--blanco);font-weight:bold;margin:15px 0}
.lista{text-align:left;background:var(--oscuro);border-radius:10px;padding:12px;margin:15px 0;font-size:14px;line-height:1.6;color:var(--blanco)}
.metodo{background:var(--medio);border:1px solid var(--claro);border-radius:10px;padding:15px;margin:12px 0;text-align:left}
.metodo b{color:var(--blanco);font-size:16px}
.dato{font-size:15px;margin:6px 0;color:var(--blanco);letter-spacing:1px;user-select: all;}
.aviso{background:rgba(93,193,185,0.15);border-left:3px solid var(--boton);padding:10px;border-radius:6px;font-size:13px;margin:15px 0;text-align:left;color:var(--claro)}
.volver{display:block;color:var(--claro);font-size:13px;margin-top:10px;text-decoration:none}
.top-btns{display:flex;gap:8px;margin-bottom:15px}
.garantia{font-size:12px;color:var(--claro);margin-top:10px;text-align:center}
.garantia b{color:var(--blanco)}
.whatsapp-float{position:fixed;bottom:20px;right:20px;background:var(--whatsapp);color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 15px var(--whatsapp);z-index:999;text-decoration:none;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,0.7)}70%{box-shadow:0 0 0 10px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
</style>
</head>
<body>

<header><h1>Nubecita Dzn Online ☁️</h1><p class="slogan">Bots Caligraficos 100% ESTABLE 24/7</p></header>

<div class="verificado">
  <b>✅ Vendedor Verificado Ica | +50 Bots Vendidos</b>
  <p>Elige 1 de los 6 estilos de fuente para tu bot.</p>
</div>

<div class="container" id="app"></div>

<footer class="footer">© 2026 Nubecita Dzn Online ☁️ | Ica, Perú<br>💳 Yape / Prex / BCP / WhatsApp: 936 994 155</footer>

<a href="https://wa.me/51936994155" target="_blank" class="whatsapp-float">💬</a>

<script>
const datos = {
  whatsapp: "51936994155",
  yape: "936 994 155",
  nombre: "Cristhofer Rojas",
  cci: "00238019628987806340",
  img: "https://files.evogb.win/BLG4n2.jpg",
  comandosImg: "https://files.evogb.win/eMe9xu.jpg",
  grupoWhatsApp: "https://chat.whatsapp.com/LjPhgjqCM934QEzYz3vrVk",

  // SOLO 1 PRODUCTO
  producto: {
    id: "CALI",
    nombre: "Caligraficos", // SOLO ESTE NOMBRE
    precioBase: 6,
    sub: "Bot WhatsApp | Elige 1 de 6 Estilos de Fuente",
    incluyeBase: "✅ Bot completo para 1 Grupo<br>✅ Fuente Caligráfica en el.menu<br>✅ Comandos:.menu.sticker.play.ia<br>✅ Instalación + Soporte 24/7"
  },

  // LOS 6 ESTILOS
  estilos: {
    "ELEG": {nombre: "Elegante", desc: "Fuente estilo firma cursiva"},
    "GOTH": {nombre: "Goth", desc: "Fuente estilo gótico dark"},
    "NEON": {nombre: "Neón", desc: "Fuente estilo neón brillante"},
    "BUBB": {nombre: "Burbuja", desc: "Fuente estilo burbuja redonda"},
    "DOUB": {nombre: "Doble", desc: "Fuente doble línea pro"},
    "ITAL": {nombre: "Italica", desc: "Fuente itálica inclinada"},
  }
};

const app = document.getElementById('app');
const params = new URLSearchParams(window.location.search);
const page = params.get('page');
const estilo = params.get('estilo'); // ELEG, GOTH etc

function renderCardEstilo(e, key){
  return `<div class="card" onclick="window.location.href='?page=producto&estilo=${key}'">
    <div class="nombre">Caligráfica ${e.nombre} <img src="${datos.img}" class="badge-img" alt="Nubecita Dzn Online ☁️"></div>
    <div class="precio">${e.desc}</div>
    <a class="btn" href="?page=producto&estilo=${key}" onclick="event.stopPropagation()">Elegir ${e.nombre}</a>
  </div>`;
}

function renderCatalogo(){ // SOLO 1 CARD
  let html = `<div class="oferta-box">
      <b>🔥 BOT CALIGRAFICOS</b>
      <p>El bot más vendido de Ica. Personaliza tu fuente.</p>
    </div>`;
  html += `<div class="top-btns">
      <a class="btn btn-morado" href="?page=comandos">🚀 Probar Bot</a>
    </div>`;

  html += `<div class="titulo-seccion">☁️ Producto Único</div>`;

  html += `<div class="card" onclick="window.location.href='?page=estilos'">
    <div class="nombre">${datos.producto.nombre} <img src="${datos.img}" class="badge-img" alt="Nubecita Dzn Online ☁️"></div>
    <div class="precio">S/ ${datos.producto.precioBase}</div>
    <p class="sub">6 Estilos Caligráficos Disponibles</p>
    <a class="btn" href="?page=estilos" onclick="event.stopPropagation()">Elegir Estilo</a>
  </div>`;

  app.innerHTML = html;
}

function renderEstilos(){ // PAGINA CON LOS 6 ESTILOS
  let html = `<div class="box">
    <h1>${datos.producto.nombre} ☁️</h1>
    <p class="sub">Elige 1 de los 6 estilos. Precio: S/ ${datos.producto.precioBase}</p>
  </div>`;

  for(const key in datos.estilos){
    html += renderCardEstilo(datos.estilos[key], key);
  }
  html += `<a class="volver" href="?">← Volver a Tienda</a>`;
  app.innerHTML = html;
}

function renderComandos(){
  app.innerHTML = `<div class="box">
    <h1>Comandos Nubecita Dzn ☁️ <img src="${datos.img}" class="badge-img" alt="Nubecita Dzn Online ☁️"></h1>
    <p class="sub">Prueba todos los comandos aquí</p>
    <img src="${datos.comandosImg}" class="comandos-img" alt="Lista de Comandos">
    <a class="btn btn-morado" href="${datos.grupoWhatsApp}" target="_blank">🚀 Probar Ahora</a>
    <a class="volver" href="?">← Volver a Tienda</a>
  </div>`;
}

function renderProducto(){
  const e = datos.estilos[estilo];
  const p = datos.producto;
  if(!e){ app.innerHTML = `<div class="box"><h1>Estilo no encontrado</h1><a class="volver" href="?page=estilos">← Volver</a></div>`; return; }

  const nombreCompleto = `${p.nombre} ${e.nombre}`; // Ej: Caligraficos Elegante
  const incluyeCompleto = `${p.incluyeBase}<br>✅ Estilo de Fuente: ${e.nombre} - ${e.desc}`;

  app.innerHTML = `<div class="box"><h1>${nombreCompleto} <img src="${datos.img}" class="badge-img" alt="Nubecita Dzn Online ☁️"></h1><p class="sub">${p.sub}</p><img src="${datos.img}" class="producto-img" alt="Demo"><h2 class="precio-big">S/ ${p.precioBase}</h2><div class="lista"><b>Qué incluye:</b><br>${incluyeCompleto}</div><a class="btn" href="?page=pago&estilo=${estilo}">Comprar Ahora</a><p class="garantia"><b>✅ Garantía Nubecita Dzn:</b> Si en 24h no te gusta, te devuelvo tu dinero por Yape.</p><a class="btn btn-outline" href="https://wa.me/${datos.whatsapp}?text=Hola%20duda%20${encodeURIComponent(nombreCompleto)}" target="_blank">Tengo una Duda</a><a class="volver" href="?page=estilos">← Elegir otro Estilo</a></div>`;
}

function renderPago(){
  const e = datos.estilos[estilo];
  const p = datos.producto;
  if(!e){ app.innerHTML = `<div class="box"><h1>Estilo no encontrado</h1><a class="volver" href="?page=estilos">← Volver</a></div>`; return; }
  const nombreCompleto = `${p.nombre} ${e.nombre}`;
  const mensaje = encodeURIComponent(`Bro ya te deposité ✅\n\nMonto: ${nombreCompleto} S/ ${p.precioBase}\nAcá está mi captura 📸`);
  app.innerHTML = `<div class="box"><h1>Métodos de Pago</h1><div class="producto" style="color:var(--blanco);font-weight:bold;font-size:16px;margin-bottom:20px">${nombreCompleto} S/ ${p.precioBase}</div><div class="metodo"><b>1. Yape / Plin</b><div class="dato">${datos.yape}</div><div class="dato">A nombre de: ${datos.nombre}</div></div><div class="metodo"><b>2. Prex Perú</b><div class="dato">${datos.yape}</div></div><div class="metodo"><b>3. Transferencia BCP</b><div class="dato">${datos.cci}</div><div class="dato">A nombre de: ${datos.nombre}</div><div class="dato">Banco: BCP</div></div><div class="aviso">⚠️ Deposita el monto exacto, toma captura y dale al botón.</div><a class="btn btn-verde" href="https://wa.me/${datos.whatsapp}?text=${mensaje}" target="_blank">✅ Ya Deposité</a><a class="volver" href="?page=producto&estilo=${estilo}">← Volver</a></div>`;
}

if(page === 'producto') renderProducto();
else if(page === 'pago') renderPago();
else if(page === 'comandos') renderComandos();
else if(page === 'estilos') renderEstilos(); // NUEVA PAGINA DE 6 ESTILOS
else renderCatalogo(); // SOLO MUESTRA 1 CARD: CALIGRAFICOS
</script>
</body>
</html>
