<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nubecita Dzn | Catálogo</title>
  <style>
    body {
      background: #0e1a1a;
      color: #e0ffe0;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #7fffd4;
    }
    .categoria {
      background: #122;
      border: 1px solid #1f3;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .cat-titulo {
      display: flex;
      align-items: center;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #bff;
    }
    .badge-img {
      width: 20px;          /* Tamaño del GIF */
      height: 20px;
      object-fit: contain;  /* No se deforma */
      border-radius: 50%;   /* Redonda */
      margin-right: 8px;    /* Espacio al texto */
      vertical-align: middle;
    }
    .producto {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #234;
    }
    .producto:last-child {
      border-bottom: 0;
    }
    .precio {
      color: #7fffd4;
      font-weight: 700;
    }
    .btn-wsp {
      display: block;
      text-align: center;
      background: #25D366;
      color: #000;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Nubecita Dzn ☁️</h1>
  <div id="catalogo"></div>
  <a class="btn-wsp" href="https://wa.me/5491153317678" target="_blank">Pedir por WhatsApp</a>

  <script>
    const datos = {
      whatsapp: "5491153317678",
      mpAlias: "nubecita.dzn.mp",
      cbu: "0003100000",
      nombre: "Cristhofer Rojas",
      img: "https://evogb.win/fBJ2A", // <-- TU GIF NUBE TRANSPARENTE ☁️
      comandosImg: "https://files.evogb.win/eMe9xu.jpg",
      grupoWhatsApp: "https://chat.whatsapp.com/LjPhgjqCM934QEzYz3vrVk",

      categorias: [
        { 
          id: "CALI", 
          nombre: "Caligraficos", 
          productos: [
            { nombre: "5 caligraficos", precio: 2000 },
            { nombre: "10 caligraficos", precio: 4000 },
            { nombre: "20 caligraficos", precio: 8000 },
          ]
        },
        { 
          id: "PLANT", 
          nombre: "Plantillas", 
          productos: [
            { nombre: "Plantilla Fyre + Audiolibro", precio: 2500 },
            { nombre: "Pack 5 Plantillas", precio: 6000 },
          ]
        }
      ]
    };

    const cont = document.getElementById('catalogo');
    datos.categorias.forEach(cat => {
      cont.innerHTML += `
        <div class="categoria">
          <div class="cat-titulo">
            <img class="badge-img" src="${datos.img}" alt="nube">
            ${cat.nombre}
          </div>
          ${cat.productos.map(p => `
            <div class="producto">
              <span>${p.nombre}</span>
              <span class="precio">$${p.precio}</span>
            </div>
          `).join('')}
        </div>
      `;
    });
  </script>

</body>
</html>
