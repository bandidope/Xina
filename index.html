<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- EDITAR AQUÍ --> Nubecita Dzn | Tienda <!-- FIN EDITAR --></title>
<style>
  :root{
    --bg:#f8f9fa; --card:#fff; --text:#111; --muted:#555; --border:#e5e7eb; 
    --red:#e60000; --blue:#003366; --shadow:#0000d;
  }
  body.dark{
    --bg:#0a0a0a; --card:#111; --text:#eee; --muted:#aaa; --border:#222; 
    --red:#ff2a2a; --blue:#004a99; --shadow:#ffffff08;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
  
  /* FONDO MEJORADO #1: Degradado + Textura sutil */
  body{
    background: 
      radial-gradient(1200px 600px at 10% -10%, #e6000010 0%, transparent 50%),
      radial-gradient(1000px 500px at 110% 10%, #00336610 0%, transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, #f1f3f5 100%);
    color:var(--text);padding-bottom:80px;min-height:100vh
  }
  body.dark{
    background: 
      radial-gradient(1200px 600px at 10% -10%, #ff2a2a08 0%, transparent 50%),
      radial-gradient(1000px 500px at 110% 10%, #004a9908 0%, transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, #0f0f0f 100%);
  }

.screen{display:none;min-height:100vh}.screen.active{display:block}

  header{background:var(--red);position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0001a}
.topbar{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;color:#fff}
.logo{font-size:24px;font-weight:900}
.buscador{flex:1;display:flex}
.buscador input{flex:1;padding:10px;border:0;border-radius:4px 0 0 4px;font-size:14px;outline:0}
.buscador button{background:var(--blue);color:#fff;border:0;padding:0 20px;border-radius:0 4px 4px 0;cursor:pointer;font-weight:700}
.tools{font-size:13px;white-space:nowrap}
.icon-btn{background:0;border:0;color:#fff;cursor:pointer;font-size:20px;margin-left:8px}
.subnav{background:var(--card);border-bottom:1px solid var(--border)}
.subnav-inner{max-width:1280px;margin:0 auto;padding:10px 16px;font-size:13px;font-weight:700;display:flex;gap:20px;overflow-x:auto;color:var(--text)}
.banner{background:var(--blue);color:#fff;text-align:center;padding:30px 16px;font-size:20px;font-weight:800}
.layout{max-width:1280px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:240px 1fr;gap:20px}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}

  /* FONDO MEJORADO #2: Tarjetas con sombra real */
.sidebar{background:var(--card);padding:16px;border-radius:12px;border:1px solid var(--border);height:fit-content;box-shadow:0 4px 12px var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative;
  box-shadow:0 2px 6px var(--shadow);transition:.2s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px var(--shadow)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f3f4f6}
.card-body{padding:12px;font-size:13px}
.card h3{font-size:13px;font-weight:400;margin-bottom:6px;height:36px;overflow:hidden}
.precio{font-size:18px;font-weight:800;color:var(--red)}
.precio del{font-size:13px;color:var(--muted);font-weight:400;margin-right:4px}
.btn{background:var(--blue);color:#fff;border:0;padding:10px;border-radius:6px;font-weight:700;width:100%;cursor:pointer;font-size:13px;margin-top:6px;transition:.2s}
.btn:hover{background:#002244}
.btn:disabled{opacity:.5;cursor:not-allowed;background:var(--muted)}
.tag{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 6px;border-radius:4px}
.stock{font-size:12px;color:#0a7; font-weight:700;margin:4px 0}
.stock.low{color:#e53935}.urgencia{font-size:11px;color:#e53935;font-weight:700}

.galeria{position:relative;overflow:hidden;background:#000;border-radius:12px}
.slides{display:flex;transition:.4s}.slides img{width:100%;flex-shrink:0;aspect-ratio:1/1;object-fit:cover}
.dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#fff5;border:1px solid #fff}
.dot.active{background:#fff}
.body{padding:16px}.body h1{font-size:22px;margin-bottom:8px}
.desc{color:var(--muted);line-height:1.5;margin:12px 0 16px}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 4px 12px var(--shadow)}
.qr{background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:30px;text-align:center;margin:12px 0;font-weight:700}
.ya-pague{background:#25D366;color:#000;text-decoration:none;display:block;text-align:center}
.wsp-float{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 4px 12px #0003;z-index:100}
.wsp-float svg{width:28px;height:28px;fill:#fff}
</style>
</head>
<body>

<!-- CATALOGO -->

  <header>
    <div class="topbar">
      <div class="logo"><!-- EDITAR AQUÍ --> Nubecita Dzn <!-- FIN EDITAR --></div>
      <div class="buscador"><input id="search" placeholder="<!-- EDITAR AQUÍ --> Busca aquí tu producto <!-- FIN EDITAR -->" oninput="filtrar()"><button><!-- EDITAR AQUÍ --> Buscar <!-- FIN EDITAR --></button></div>
      <div class="tools"><!-- EDITAR AQUÍ --> Hola! Ingresa <br><b>Mi cuenta</b> <!-- FIN EDITAR --></div>

    <aside class="sidebar">
      <h3><!-- EDITAR AQUÍ --> Categorías <!-- FIN EDITAR --></h3>
      <div id="filtros"></div>

<div class="screen" id="productoScreen">
  <header><div class="topbar"><span style="cursor:pointer;font-weight:700" onclick="show('catalogoScreen')"><!-- EDITAR AQUÍ --> ← Volver a resultados <!-- FIN EDITAR --></span></div></header>

  <header><div class="topbar"><span style="cursor:pointer;font-weight:700" onclick="show('productoScreen')"><!-- EDITAR AQUÍ --> ← Volver <!-- FIN EDITAR --></span></div></header>
  <div class="layout" style="grid-template-columns:1fr"><div class="box"><h1 style="margin-bottom:16px;font-size:20px"><!-- EDITAR AQUÍ --> Finalizar compra <!-- FIN EDITAR --></h1><h3 id="pagoNom"></h3><div><!-- EDITAR AQUÍ --> Total: <!-- FIN EDITAR --> <b id="pagoTotal"></b></div></div><div class="box"><h3><!-- EDITAR AQUÍ --> Paga por Yape <!-- FIN EDITAR --></h3><div><!-- EDITAR AQUÍ --> 936 994 155 <!-- FIN EDITAR --></div><div class="qr"><!-- EDITAR AQUÍ --> Escanea aquí <!-- FIN EDITAR --></div></div><a href="#" id="wspBtn" target="_blank" class="btn ya-pague"><!-- EDITAR AQUÍ --> Ya pagué ✅ Ir a WhatsApp <!-- FIN EDITAR --></a></div>
</div>

<script>
/* 

=== SOLO EDITA ESTA PARTE === 

*/
const productos = [
  {id:1, nom:"Top básico manga corta Algodón 100%", precio:39.90, imgs:["https://via.placeholder.com/400"], desc:"Tallas S M L XL.", stock:12, cat:"Moda Mujer"},
  {id:2, nom:"Vestido casual print floral", precio:63.90, precioOld:79.90, imgs:["https://via.placeholder.com/400"], desc:"Talla única.", stock:3, cat:"Moda Mujer"},
  {id:3, nom:"Polera oversize negra Fleece", precio:89.90, imgs:["https://via.placeholder.com/400"], desc:"Unisex.", stock:8, cat:"Moda Hombre"},
  {id:4, nom:"Jean recto tiro alto Denim", precio:99.90, imgs:["https://via.placeholder.com/400"], desc:"Tallas 28-34.", stock:0, cat:"Moda Mujer"},
];
/* 

=== NO TOQUES NADA DEBAJO ===

*/

let productoActual=null,contadorInterval=null,filtroCat='Todos';
function toggleDark(){document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')}
if(localStorage.dark==='true')document.body.classList.add('dark');

const cats=[...new Set(productos.map(p=>p.cat))];
document.getElementById('filtros').innerHTML=cats.map(c=>`<label><input type="radio" name="cat" ${c===filtroCat?'checked':''} onclick="setCat('${c}')">${c}</label>`).join('');

function setCat(c){filtroCat=c;filtrar()}
function filtrar(){
  const q=document.getElementById('search').value.toLowerCase();
  const list=productos.filter(p=>(filtroCat==='Todos'||p.cat===filtroCat)&&p.nom.toLowerCase().includes(q));
  document.getElementById('productos').innerHTML=list.map(p=>`<div class="card">${p.precioOld?'<div class="tag">-21%</div>':''}<img src="${p.imgs[0]}"><div class="card-body"><h3>${p.nom}</h3><div class="precio">${p.precioOld?`<del>S/ ${p.precioOld.toFixed(2)}</del>`:''} S/ ${p.precio.toFixed(2)}</div><div class="stock ${p.stock<5?'low':''}">${p.stock>0?`Stock: ${p.stock}`:'Agotado'}</div><button class="btn" onclick="verProducto(${p.id})" ${p.stock===0?'disabled':''}><!-- EDITAR AQUÍ --> Agregar al carrito <!-- FIN EDITAR --></button></div></div>`).join('')||'<div style="padding:40px">No hay productos</div>';
}
function show(id){if(contadorInterval)clearInterval(contadorInterval);document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function verProducto(id){
  productoActual=productos.find(x=>x.id===id);
  document.getElementById('pNom').textContent=productoActual.nom;
  document.getElementById('pPrecio').innerHTML=`${productoActual.precioOld?`<del>S/ ${productoActual.precioOld.toFixed(2)}</del>`:''} S/ ${productoActual.precio.toFixed(2)}`;
  document.getElementById('pDesc').textContent=productoActual.desc;
  document.getElementById('pStock').textContent=productoActual.stock>0?`Disponible: ${productoActual.stock} unidades`:'Agotado';
  document.getElementById('comprarBtn').disabled=productoActual.stock===0;
  const slides=document.getElementById('slides');
  slides.innerHTML=productoActual.imgs.map(img=>`<img src="${img}">`).join('');
  let index=0,startX=0;
  slides.ontouchstart=e=>startX=e.touches[0].clientX;
  slides.ontouchend=e=>{const dx=e.changedTouches[0].clientX-startX;if(dx<-50&&index<productoActual.imgs.length-1)index++;if(dx>50&&index>0)index--;slides.style.transform=`translateX(-${index*100}%)`}
  let vistas = 32 + Math.floor(Math.random()*60);
  const el = document.getElementById('pUrgencia');
  el.textContent = `🔥 ${vistas} personas viendo esto`;
  contadorInterval = setInterval(()=>{vistas += Math.floor(Math.random()*5)-2;if(vistas<18)vistas=18; if(vistas>120)vistas=120;el.textContent = `🔥 ${vistas} personas viendo esto`},5000);
  show('productoScreen');
}
document.getElementById('comprarBtn').onclick=()=>{document.getElementById('pagoNom').textContent=productoActual.nom;document.getElementById('pagoTotal').textContent=`S/ ${productoActual.precio.toFixed(2)}`;document.getElementById('wspBtn').href=`<!-- EDITAR AQUÍ --> https://wa.me/51936994155?text=${encodeURIComponent(`Hola! Ya pagué ✅\n\n${productoActual.nom} S/ ${productoActual.precio.toFixed(2)}`)} <!-- FIN EDITAR -->`;show('pagoScreen')}
filtrar();
</script>
</body>
