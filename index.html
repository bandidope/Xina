<head>

<style>
  :root{--bg:#fff;--card:#fff;--text:#333;--muted:#666;--border:#e0e0e0;--red:#e60000;--green:#007600}
  body.dark{--bg:#0f0f0f;--card:#1a1a1a;--text:#eee;--muted:#aaa;--border:#333;--red:#ff2a2a;--green:#1db954}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,Arial,sans-serif}
  body{background:var(--bg);color:var(--text)}
.screen{display:none;min-height:100vh}.screen.active{display:block}

  /* HEADER RIPLEY */
  header{background:var(--red);position:sticky;top:0;z-index:10}
.topbar{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;color:#fff}
.logo{font-size:26px;font-weight:900;letter-spacing:-1px}
.buscador{flex:1;display:flex}
.buscador input{flex:1;padding:10px 12px;border:0;border-radius:4px 0 0 4px;font-size:14px;outline:0}
.buscador button{background:#333;color:#fff;border:0;padding:0 20px;border-radius:0 4px 4px 0;cursor:pointer;font-weight:700}
.icon-btn{background:0;border:0;color:#fff;cursor:pointer;font-size:20px}

.container{max-width:1200px;margin:0 auto;padding:20px 16px}

  /* GRID RIPLEY 5 COLUMNAS */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
  @media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}

  /* CARD RIPLEY */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
.card:hover{box-shadow:0 4px 12px #0001}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f5f5f5}
.badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}
.tag{background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 6px;border-radius:4px}
.tag.green{background:var(--green)}
.card-body{padding:12px;font-size:12px}
.marca{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:4px}
.card h3{font-size:13px;font-weight:400;margin-bottom:8px;height:36px;overflow:hidden;line-height:1.4}
.precio-wrap{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.precio{font-size:20px;font-weight:800;color:var(--text)}
.precio del{font-size:13px;color:var(--muted);font-weight:400}
.precio-desc{font-size:12px;color:var(--muted)}
.btn{background:var(--red);color:#fff;border:0;padding:10px;border-radius:6px;font-weight:700;width:100%;cursor:pointer;font-size:14px;margin-top:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;background:var(--muted)}
.stock{font-size:12px;color:var(--green); font-weight:700;margin:4px 0}
.stock.low{color:var(--red)}.urgencia{font-size:11px;color:var(--red);font-weight:700}

.galeria{position:relative;overflow:hidden;background:#000;border-radius:8px}
.slides{display:flex;transition:.4s}.slides img{width:100%;flex-shrink:0;aspect-ratio:1/1;object-fit:cover}
.dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#fff5;border:1px solid #fff}
.dot.active{background:#fff}
.body{padding:16px}.body h1{font-size:24px;margin-bottom:8px;font-weight:400}
.vendido{font-size:13px;color:var(--muted);margin-bottom:12px}
.desc{color:var(--muted);line-height:1.5;margin:12px 0 16px;font-size:14px}
.box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.qr{background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:30px;text-align:center;margin:12px 0;font-weight:700}
.ya-pague{background:#25D366;color:#000;text-decoration:none;display:block;text-align:center}
.wsp-float{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 4px 12px #0003;z-index:100}
.wsp-float svg{width:28px;height:28px;fill:#fff}
</style>
</head>
<body>

  <header>
    <div class="topbar">
      <div class="logo"><!-- EDITAR AQUÍ --> Nubecita Dzn <!-- FIN EDITAR --></div>
      <div class="buscador"><input id="search" placeholder="<!-- EDITAR AQUÍ --> Busca tu producto <!-- FIN EDITAR -->" oninput="filtrar()"><button><!-- EDITAR AQUÍ --> Buscar <!-- FIN EDITAR --></button></div>
      <button class="icon-btn" onclick="toggleDark()">🌙</button>

  <div class="container"><div class="grid" id="productos"></div></div>
</div>

<!-- PRODUCTO -->

  <div class="container" style="max-width:900px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">

      <div class="body">
        <div class="marca"><!-- EDITAR AQUÍ --> NUBECITA DZN <!-- FIN EDITAR --></div>
        <h1 id="pNom"></h1>
        <div class="vendido"><!-- EDITAR AQUÍ --> Vendido por: Nubecita Dzn <!-- FIN EDITAR --></div>
        <div class="precio-wrap" id="pPrecio"></div>
        <div class="precio-desc"><!-- EDITAR AQUÍ --> Internet <!-- FIN EDITAR --></div>

        <button class="btn" id="comprarBtn"><!-- EDITAR AQUÍ --> Comprar ahora <!-- FIN EDITAR --></button>

  <div class="container" style="max-width:600px"><div class="box"><h1 style="margin-bottom:16px;font-size:20px"><!-- EDITAR AQUÍ --> Finalizar compra <!-- FIN EDITAR --></h1><h3 id="pagoNom"></h3><div><!-- EDITAR AQUÍ --> Total: <!-- FIN EDITAR --> <b id="pagoTotal"></b></div></div><div class="box"><h3><!-- EDITAR AQUÍ --> Paga por Yape <!-- FIN EDITAR --></h3><div><!-- EDITAR AQUÍ --> 936 994 155 <!-- FIN EDITAR --></div><div class="qr"><!-- EDITAR AQUÍ --> Escanea aquí <!-- FIN EDITAR --></div></div><a href="#" id="wspBtn" target="_blank" class="btn ya-pague"><!-- EDITAR AQUÍ --> Ya pagué ✅ Ir a WhatsApp <!-- FIN EDITAR --></a></div>
</div>

<a href="<!-- EDITAR AQUÍ --> https://wa.me/51936994155?text=Hola%20Nubecita%20Dzn <!-- FIN EDITAR -->" target="_blank" class="wsp-float"><svg viewBox="0 0 32 32"><path d="M16.5C7.4.5.5 7.4.5 16c0 2.8.7 5.5 2.1 7.9L.5 31.5l7.8-2.1c2.3 1.3 4.9 1.9 7.7 1.9 8.6 0 15.5-6.9 15.5-15.5S24.6.5 16.5zm0 28.2c-2.4 0-4.7-.6-6.8-1.8l-.5-.3-4.6 1.2 1.2-4.5-.3-.5c-1.3-2.1-1.9-4.5-1.9-7 0-7.3 5.9-13.2 13.2-13.2S29.2 8.7 29.2 16 23.3 28.7 16 28.7z"/><path d="M23.8 19.2c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.8.9-1.9-.2.1-.4.1-.7 0-.3-.2-1.2-.4-2.3-1.4-.8-.7-1.4-1.6-1.6-1.9-.2-.3 0-.5.1-.7.1-.1.3-.3.4-.5.1-.2.2-.4.3-.5.1-.2.1-.3 0-.5-.1-.2-.7-1.7-1-2.3-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.6.2-1.2.2-1.3 0-.1-.1-.3-.4-.5z"/></svg></a>

<script>
/*

=== SOLO EDITA ESTA PARTE ===

*/
const productos = [
  // precioOld = precio tachado. Borra precioOld si no hay oferta
  {id:1, nom:"Top básico manga corta Algodón 100% Tallas S M L XL", precio:39.90, precioOld:79.90, imgs:["https://via.placeholder.com/400"], desc:"Algodón peinado. 1 unidad.", stock:12, marca:"NUBECITA DZN", llega:"Llega mañana"},
  {id:2, nom:"Vestido casual print floral Talla única", precio:63.90, precioOld:79.90, imgs:["https://via.placeholder.com/400"], desc:"Estampado floral. 1 unidad.", stock:3, marca:"NUBECITA DZN", llega:"Llega mañana"},
  {id:3, nom:"Polera oversize negra Fleece grueso Unisex", precio:89.90, imgs:["https://via.placeholder.com/400"], desc:"Fleece 320gr. 1 unidad.", stock:8, marca:"NUBECITA DZN", llega:""},
  {id:4, nom:"Jean recto tiro alto Denim rígido Tallas 28-34", precio:99.90, imgs:["https://via.placeholder.com/400"], desc:"Denim rígido. 1 unidad.", stock:0, marca:"NUBECITA DZN", llega:""},
];
/*

=== NO TOQUES NADA DEBAJO ===

*/

let productoActual=null,contadorInterval=null;
function toggleDark(){document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')}
if(localStorage.dark==='true')document.body.classList.add('dark');

function filtrar(){
  const q=document.getElementById('search').value.toLowerCase();
  const list=productos.filter(p=>p.nom.toLowerCase().includes(q));
  document.getElementById('productos').innerHTML=list.map(p=>{
    let descuento = p.precioOld? Math.round((1-p.precio/p.precioOld)*100) : 0;
    return `<div class="card">
      <div class="badges">
        ${descuento?`<div class="tag">-${descuento}%</div>`:''}
        ${p.llega?`<div class="tag green">${p.llega}</div>`:''}
      </div>
      <img src="${p.imgs[0]}">
      <div class="card-body">
        <div class="marca">${p.marca}</div>
        <h3>${p.nom}</h3>
        <div class="precio-wrap">
          <div class="precio">${p.precioOld?`<del>S/ ${p.precioOld.toFixed(2)}</del>`:''} S/ ${p.precio.toFixed(2)}</div>
        </div>
        <div class="precio-desc">Internet</div>
        <div class="stock ${p.stock<5?'low':''}">${p.stock>0?`Stock: ${p.stock}`:'Agotado'}</div>
        <button class="btn" onclick="verProducto(${p.id})" ${p.stock===0?'disabled':''}>Agregar al carrito</button>
      </div>
    </div>`
  }).join('')||'<div style="padding:40px">No hay productos</div>';
}
function show(id){if(contadorInterval)clearInterval(contadorInterval);document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function verProducto(id){
  productoActual=productos.find(x=>x.id===id);
  document.querySelector('#productoScreen.marca').textContent=productoActual.marca;
  document.getElementById('pNom').textContent=productoActual.nom;
  document.getElementById('pPrecio').innerHTML=`<div class="precio">${productoActual.precioOld?`<del>S/ ${productoActual.precioOld.toFixed(2)}</del>`:''} S/ ${productoActual.precio.toFixed(2)}</div>`;
  document.getElementById('pDesc').textContent=productoActual.desc;
  document.getElementById('pStock').textContent=productoActual.stock>0?`Disponible: ${productoActual.stock} unidades`:'Agotado';
  document.getElementById('comprarBtn').disabled=productoActual.stock===0;
  const slides=document.getElementById('slides');
  slides.innerHTML=productoActual.imgs.map(img=>`<img src="${img}">`).join('');
  let index=0,startX=0;
  slides.ontouchstart=e=>startX=e.touches[0].clientX;
  slides.ontouchend=e=>{const dx=e.changedTouches[0].clientX-startX;if(dx<-50&&index<productoActual.imgs.length-1)index++;if(dx>50&&index>0)index--;slides.style.transform=`translateX(-${index*100}%)`}
  let vistas = 32 + Math.floor(Math.random()*60);
  const el = document.getElementById('pUrgencia');
  el.textContent = `🔥 ${vistas} personas viendo esto`;
  contadorInterval = setInterval(()=>{vistas += Math.floor(Math.random()*5)-2;if(vistas<18)vistas=18; if(vistas>120)vistas=120;el.textContent = `🔥 ${vistas} personas viendo esto`},5000);
  show('productoScreen');
}
document.getElementById('comprarBtn').onclick=()=>{document.getElementById('pagoNom').textContent=productoActual.nom;document.getElementById('pagoTotal').textContent=`S/ ${productoActual.precio.toFixed(2)}`;document.getElementById('wspBtn').href=`<!-- EDITAR AQUÍ --> https://wa.me/51936994155?text=${encodeURIComponent(`Hola! Ya pagué ✅\n\n${productoActual.nom} S/ ${productoActual.precio.toFixed(2)}`)} <!-- FIN EDITAR -->`;show('pagoScreen')}
filtrar();
</script>
