<style>
:root[data-theme="dark"]{
  --bg:#0a0e1a; 
  --card:#0f172a; 
  --text:#f1f5f9; 
  --muted:#94a3b8; 
  --cyan:#00e5ff; /* El celeste neón del borde */
  --border:#1e293b; 
  --green:#25D366; /* El verde del botón */
  --mp:#009ee5
}
:root[data-theme="light"]{
  /* Forzamos el modo claro a que se vea igual que oscuro */
  --bg:#0a0e1a; 
  --card:#0f172a; 
  --text:#f1f5f9; 
  --muted:#94a3b8; 
  --cyan:#00e5ff; 
  --border:#1e293b; 
  --green:#25D366; 
  --mp:#009ee5
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding-bottom:70px;transition:.3s}
header{position:sticky;top:0;background:rgba(10,14,26,.8);backdrop-filter:blur(10px);z-index:10;padding:14px 16px;border-bottom:1px solid var(--border)}
.topbar{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:1.3rem;color:var(--cyan)}
.theme-btn{background:var(--card);border:1px solid var(--border);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer}
.tabs{display:flex;gap:18px;margin-top:14px;overflow-x:auto;padding:0 16px 4px}
.tab{color:var(--muted);font-weight:600;cursor:pointer;padding-bottom:8px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--cyan);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.3s ease;cursor:pointer}
.card:hover{border-color:var(--cyan);box-shadow:0 0 20px rgba(0,229,255,.2)}
.card-img{height:140px;position:relative;overflow:hidden}
.carousel-track{display:flex;height:100%;transition:transform.8s ease}
.carousel-slide{min-width:100%;background-size:cover;background-position:center}
.tag{position:absolute;top:10px;left:10px;background:var(--cyan);color:#0a0a0f;font-size:.65rem;font-weight:800;padding:4px 10px;border-radius:6px}
.card-body{padding:12px}
.card-title{font-size:.9rem;font-weight:700;margin-bottom:8px}
.card-price{font-size:1.2rem;font-weight:800;color:var(--cyan)}
.btn-contratar{width:100%;background:var(--cyan);color:#0a0e1a;border:0;padding:12px;border-radius:10px;font-weight:800;margin-top:8px;cursor:pointer}
.screen{display:none}.screen.active{display:block}
.product-wrap{padding:16px;max-width:600px;margin:0 auto}
.product-img{width:100%;height:240px;background-size:cover;background-position:center;border-radius:16px;margin-bottom:16px;border:1px solid var(--border)}
.product-title{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.product-price{font-size:2rem;font-weight:800;color:var(--cyan)}
.product-desc-title{font-size:1rem;font-weight:700;margin:16px 0 8px;color:var(--cyan)}
.product-desc{color:var(--muted);line-height:1.7;margin-bottom:18px}
.product-list{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:24px;list-style:none}
.product-list li{padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:8px}
.product-list li:last-child{border:0}
.product-list li b{color:var(--cyan)}
.btn-comprar{width:100%;background:var(--green);color:#fff;border:0;padding:16px;border-radius:12px;font-weight:800;margin-bottom:10px;cursor:pointer;font-size:1.05rem}
.btn-volver-prod{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);padding:16px;border-radius:12px;font-weight:800;cursor:pointer}

/* ESTE ES EL MODAL DE LA IMAGEN */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal.active{display:flex}
.modal-box{background:#0f172a;border:1.5px solid var(--cyan);border-radius:20px;width:100%;max-width:360px;box-shadow:0 0 30px rgba(0,229,255,.3)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:1.2rem;font-weight:800}
.x{background:rgba(255,255,255,.1);border:0;width:32px;height:32px;border-radius:50%;font-size:1.3rem;color:var(--muted);cursor:pointer}
.amount{font-size:2.2rem;font-weight:800;color:var(--cyan);text-align:center;margin:16px 0}
.payment-tabs{display:flex;gap:8px;padding:0 18px;margin-bottom:16px}
.payment-tab{flex:1;padding:12px;background:transparent;border:1px solid var(--border);border-radius:12px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.payment-tab.active{background:var(--cyan);color:#0a0e1a;border-color:var(--cyan)}
.payment-tab.mp.active{background:#009ee5;color:#fff;border-color:#009ee5}
.copy-box{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);padding:12px 14px;border-radius:12px;margin:0 18px 16px;border:1px solid var(--border)}
.copy-btn{padding:8px 16px;background:var(--cyan);border:0;border-radius:10px;color:#0a0e1a;font-weight:800;cursor:pointer}
.btn-wsp{width:calc(100% - 36px);background:var(--green);color:#fff;border:0;padding:14px;border-radius:12px;font-weight:800;margin:0 18px 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1rem}
.wsp-float{position:fixed;bottom:16px;right:16px;width:54px;height:54px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,.4)}
</style>
</head>

function selTab(k,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');const g=document.getElementById('productos');g.innerHTML=CATEGORIAS[k].data.map(p=>`<div class="card" onclick="openProduct(${p.id})"><div class="card-img"><div class="carousel-track" id="c${p.id}">${p.imgs.map(u=>`<div class="carousel-slide" style="background-image:url('${u}')"></div>`).join('')}</div><div class="tag">Nuevo</div></div><div class="card-body"><div class="card-cat">${CATEGORIAS[k].nom}</div><div class="card-title">${p.nom}</div><div class="card-price">${fmt(p.precio)}</div><div class="card-price-sub">~$${p.precio} USD</div><button class="btn-contratar" onclick="event.stopPropagation();openProduct(${p.id})">Información</button></div></div>`).join('');setInterval(()=>{Object.values(CATEGORIAS).forEach(c=>c.data.forEach(p=>{let i=0;const t=document.getElementById(`c${p.id}`);if(t){i=(i+1)%p.imgs.length;t.style.transform=`translateX(-${i*100}%)`}}))},4000)}
function findProduct(id){for(const k in CATEGORIAS){const f=CATEGORIAS[k].data.find(p=>p.id===id);if(f)return f}}
function openProduct(id){const p=findProduct(id);document.getElementById('productDetail').innerHTML=`<div class="product-img" style="background-image:url('${p.imgs[0]}')"></div><div class="product-title">${p.nom}</div><div class="product-price">${fmt(p.precio)}</div><div class="product-price-sub">~$${p.precio} USD</div><div class="product-desc-title">¿Para qué sirve?</div><div class="product-desc">${p.desc}</div><ul class="product-list">${p.features.map(f=>`<li><b>✓</b> ${f}</li>`).join('')}</ul><button class="btn-comprar" onclick="buy(${p.precio},'${p.nom}')">💎 Comprar Ahora</button><button class="btn-volver-prod" onclick="showTienda()">← Volver a la tienda</button>`;document.getElementById('tiendaScreen').classList.remove('active');document.getElementById('productScreen').classList.add('active');window.scrollTo(0,0)}
function showTienda(){document.getElementById('productScreen').classList.remove('active');document.getElementById('tiendaScreen').classList.add('active')}
function buy(p,n){precio=p;prodNom=n;document.getElementById('montoTotal').textContent=fmt(p);document.getElementById('userDiam').textContent=USUARIO_DIAMANTES;document.getElementById('aliasMP').textContent=ALIAS_MERCADOPAGO;document.getElementById('mpQR').src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${ALIAS_MERCADOPAGO}`;document.getElementById('pagoModal').classList.add('active')}
function selectPayment(t,e){document.querySelectorAll('.payment-tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.getElementById('diamantesContent').style.display=t==='diamantes'?'block':'none';document.getElementById('mpContent').style.display=t==='mp'?'block':'none'}
function copyText(t){navigator.clipboard.writeText(t);alert('Copiado')}
function cerrarPago(){document.getElementById('pagoModal').classList.remove('active')}
document.getElementById('wspBtn').onclick=()=>{window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=Hola, pagué por ${prodNom} ${fmt(precio)}`,'_blank');cerrarPago()}
function toggleTheme(){const r=document.documentElement;const t=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'🌙':'☀️'}
function openCurrency(){currentCurrency=currentCurrency==='PEN'?'USD':'PEN';document.getElementById('currencyBtn').textContent=currentCurrency;renderTabs()}
document.addEventListener('DOMContentLoaded',()=>{document.querySelector('.logo').textContent=NOMBRE_TIENDA;document.querySelector('.wsp-float').href=`https://wa.me/${NUMERO_WHATSAPP}`;renderTabs()})
</script></body></html>
