<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Three Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* V56.0 TU LOBO EN TODOS */
:root[data-theme="dark"]{
  --bg:#0d0d0d; --header:#1a1a1a; --card:#111; --text:#ffffff; --pink:#ff1a8c; --border:#2a2a2a; --green:#25D366; --muted:#aaa;
}
:root[data-theme="light"]{
  --bg:#fff0f5; --header:#ffe6f0; --card:#ffffff; --text:#1a0a0f; --pink:#d4005c; --border:#f2c2d6; --green:#25D366; --muted:#6e4a57;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding-bottom:70px;transition:.3s}
header{position:sticky;top:0;background:var(--header);z-index:10;padding:14px 16px;border-bottom:3px solid var(--pink)}
.topbar{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:1.4rem;color:var(--text)}
.currency-btn{background:var(--card);border:1.5px solid var(--border);padding:8px 14px;border-radius:50px;font-weight:800;color:var(--pink);display:flex;align-items:center;gap:6px}
.theme-btn{background:var(--card);border:1.5px solid var(--border);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer}
.tabs{display:flex;gap:24px;margin-top:14px;overflow-x:auto;padding:0 16px 8px;border-bottom:2px solid var(--pink)}
.tab{color:var(--muted);font-weight:800;cursor:pointer;padding-bottom:8px;border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem}
.tab.active{color:var(--pink);border-color:var(--pink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:.3s;position:relative;padding-bottom:12px}
.card:hover{border-color:var(--pink)}
.card-img{height:180px;position:relative;overflow:hidden;border-radius:16px 16px 0 0;background-size:cover;background-position:center}
.tag{position:absolute;top:8px;left:8px;background:var(--pink);color:#fff;font-size:.75rem;font-weight:900;padding:6px 12px;border-radius:8px;z-index:2}
.card-body{padding:12px 14px 0}
.card-title{font-size:1rem;font-weight:800;margin-bottom:6px;color:var(--text)}
.card-price{font-size:1.3rem;font-weight:900;color:var(--pink);margin-bottom:10px}
.btn-contratar{width:100%;background:var(--pink);color:#fff;border:0;padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-size:.95rem}
.screen{display:none}.screen.active{display:block}
.product-wrap{padding:18px;max-width:600px;margin:0 auto}
.product-img{width:100%;height:260px;background-size:cover;background-position:center;border-radius:16px;margin-bottom:18px;border:1.5px solid var(--border)}
.product-title{font-size:1.8rem;font-weight:900;margin-bottom:8px;color:var(--text)}
.product-price{font-size:2.2rem;font-weight:900;color:var(--pink)}
.product-desc-title{font-size:1.1rem;font-weight:800;margin:18px 0 8px;color:var(--pink)}
.product-desc{color:var(--muted);line-height:1.8;margin-bottom:20px;font-size:1rem}
.product-list{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:24px;list-style:none}
.product-list li{padding:12px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;font-weight:600;color:var(--text)}
.product-list li:last-child{border:0}
.product-list li b{color:var(--pink);font-size:1.2rem}
.btn-comprar{width:100%;background:var(--green);color:#fff;border:0;padding:18px;border-radius:14px;font-weight:900;margin-bottom:12px;cursor:pointer;font-size:1.1rem}
.btn-volver-prod{width:100%;background:var(--card);color:var(--text);border:1.5px solid var(--border);padding:18px;border-radius:14px;font-weight:800;cursor:pointer;font-size:1.1rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal.active{display:flex}
.modal-box{background:var(--card);border:2px solid var(--pink);border-radius:22px;width:100%;max-width:370px}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:1.3rem;font-weight:900;color:var(--text)}
.x{background:rgba(0,0,0,.1);border:0;width:34px;height:34px;border-radius:50%;font-size:1.4rem;color:var(--muted);cursor:pointer;font-weight:800}
.amount{font-size:2.4rem;font-weight:900;color:var(--pink);text-align:center;margin:18px 0}
.payment-tabs{display:flex;gap:10px;padding:0 20px;margin-bottom:18px}
.payment-tab{flex:1;padding:13px;background:transparent;border:1.5px solid var(--border);border-radius:14px;font-weight:800;color:var(--muted);cursor:pointer}
.payment-tab.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.copy-box{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:14px 16px;border-radius:14px;margin:0 20px 18px;border:1.5px solid var(--border);font-weight:700}
.copy-btn{padding:10px 18px;background:var(--pink);border:0;border-radius:12px;color:#fff;font-weight:800;cursor:pointer}
.btn-wsp{width:calc(100% - 40px);background:var(--green);color:#fff;border:0;padding:16px;border-radius:14px;font-weight:900;margin:0 20px 20px;cursor:pointer;font-size:1.05rem}
.wsp-float{position:fixed;bottom:18px;right:18px;width:56px;height:56px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,.5)}
</style>
</head>
<body>
<header>
<div class="topbar">
<div class="logo">For Three Bot</div>
<div style="display:flex;gap:10px;align-items:center">
<button class="currency-btn" id="currencyBtn" onclick="openCurrency()">🌎 PEN</button>
<button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>
</div>
<div class="tabs" id="tabs"></div>
</header>
<div id="tiendaScreen" class="screen active"><div class="grid" id="productos">Cargando...</div></div>
<div id="productScreen" class="screen"><div class="product-wrap" id="productDetail"></div></div>
<div id="pagoModal" class="modal"><div class="modal-box">
<div class="modal-header"><h3>Checkout</h3><button class="x" onclick="cerrarPago()">×</button></div>
<div class="amount" id="montoTotal">S/ 0.00</div>
<div class="payment-tabs">
<button class="payment-tab active" onclick="selectPayment('diamantes',event)">💎 Diamantes</button>
<button class="payment-tab" onclick="selectPayment('mp',event)">💙 MP</button>
</div>
<div id="diamantesContent"><div class="copy-box"><span>Usuario: <b id="userDiam">tuusuario</b></span><button class="copy-btn" onclick="copyText(USUARIO_DIAMANTES)">Copiar</button></div></div>
<div id="mpContent" style="display:none"><div class="copy-box"><span>Alias: <b id="aliasMP">tu.alias.mp</b></span><button class="copy-btn" onclick="copyText(ALIAS_MERCADOPAGO)">Copiar</button></div></div>
<button class="btn-wsp" id="wspBtn">💬 Enviar Comprobante</button>
</div></div>
<a class="wsp-float" href="https://wa.me/51936994155" target="_blank">💬</a>
<script>
// ================== ZONA EDITABLE ==================
const NOMBRE_TIENDA = "For Three Bot";
const NUMERO_WHATSAPP = "51936994155";
const USUARIO_DIAMANTES = "tuusuario";
const ALIAS_MERCADOPAGO = "tu.alias.mp";
const TC = 3.70;

// TU FOTO DEL LOBO PARA TODOS
const FOTO_LOBO = "https://files.evogb.win/oHtZvL.jpg";

const CATEGORIAS = {bots: {nom:"Bots",data:[
    {id:1,nom:"Bot Para Grupos",precio:5,imgs:[FOTO_LOBO],desc:"Bot completo 24/7 para grupos.",features:["Descargas YT","IA ChatGPT","Admin"]},
    {id:2,nom:"Bot VIP",precio:25,imgs:[FOTO_LOBO],desc:"Bot con tu marca.",features:["Nombre propio","Hosting 1GB"]},
    {id:3,nom:"Bot Antidelete",precio:8,imgs:[FOTO_LOBO],desc:"Guarda lo que borran.",features:["Antidelete","Backup"]},
    {id:4,nom:"Bot +18",precio:12,imgs:[FOTO_LOBO],desc:"Comandos +18.",features:["Pack IA","Privado"]},
    {id:5,nom:"Bot Economía",precio:15,imgs:[FOTO_LOBO],desc:"Sistema monedas.",features:["Monedas","Casino"]},
    {id:6,nom:"Bot Todo en 1",precio:30,imgs:[FOTO_LOBO],desc:"El más completo.",features:["+200 Comandos","Premium"]}
  ]},
  hosting: {nom:"Hosting",data:[
    {id:7,nom:"1GB RAM",precio:10,imgs:[FOTO_LOBO],desc:"Para 1 bot.",features:["1GB RAM","Panel"]},
    {id:8,nom:"4GB RAM",precio:25,imgs:[FOTO_LOBO],desc:"Para 3-4 bots.",features:["4GB RAM","Prioritario"]},
    {id:9,nom:"Ilimitado",precio:120,imgs:[FOTO_LOBO],desc:"Sin límites.",features:["16GB RAM","VIP"]}
  ]},
  cuentas: {nom:"Cuentas",data:[
    {id:10,nom:"Netflix 1M",precio:15,imgs:[FOTO_LOBO],desc:"Netflix 1 mes.",features:["4K","Garantía"]},
    {id:11,nom:"Spotify 1M",precio:8,imgs:[FOTO_LOBO],desc:"Sin ads.",features:["Sin Ads","Offline"]},
    {id:12,nom:"Disney+ 1M",precio:12,imgs:[FOTO_LOBO],desc:"Disney+ 1 mes.",features:["4K","Estrenos"]},
    {id:13,nom:"Crunchyroll 1M",precio:10,imgs:[FOTO_LOBO],desc:"Anime sin cortes.",features:["1080p","Sin Ads"]}
  ]},
  servicios: {nom:"Servicios",data:[
    {id:14,nom:"Crear Bot",precio:50,imgs:[FOTO_LOBO],desc:"Bot desde cero.",features:["Custom","24h"]},
    {id:15,nom:"Configurar Bot",precio:20,imgs:[FOTO_LOBO],desc:"Te lo configuro.",features:["Instalación","Soporte"]},
    {id:16,nom:"Reparar Bot",precio:15,imgs:[FOTO_LOBO],desc:"Arreglo tu bot.",features:["Fix 100%","Garantía"]},
    {id:17,nom:"Panel Ptero",precio:30,imgs:[FOTO_LOBO],desc:"Instalo panel.",features:["Pterodactyl","SSL"]}
  ]},
  packs: {nom:"Packs",data:[
    {id:18,nom:"Pack Inicio",precio:35,imgs:[FOTO_LOBO],desc:"Bot+Hosting 1GB.",features:["Bot Grupos","1 Mes"]},
    {id:19,nom:"Pack Emprendedor",precio:65,imgs:[FOTO_LOBO],desc:"Bot VIP+Hosting.",features:["Bot VIP","Logo"]},
    {id:20,nom:"Pack Agencia",precio:150,imgs:[FOTO_LOBO],desc:"Para revender.",features:["10 Bots","Web Pro"]},
    {id:21,nom:"Pack Streaming",precio:55,imgs:[FOTO_LOBO],desc:"Todas las cuentas.",features:["Netflix+Spotify","Ahorra 70%"]},
    {id:22,nom:"Pack Gaming",precio:45,imgs:[FOTO_LOBO],desc:"Cuentas gaming.",features:["FF Elite","COD CP"]},
    {id:23,nom:"Pack Servicios",precio:120,imgs:[FOTO_LOBO],desc:"Todo lo que necesitas.",features:["Web+Logo+Bot","Garantía"]},
    {id:24,nom:"Pack VIP",precio:200,imgs:[FOTO_LOBO],desc:"Acceso total.",features:["Todos los bots","VPS 8GB"]},
    {id:25,nom:"Pack Reseller",precio:300,imgs:[FOTO_LOBO],desc:"Para mayor.",features:["50 Bots","Panel"]}
  ]}
};
// JS
let cur='PEN',precio=0,prodNom='';const curr={PEN:1,USD:1/TC};
function fmt(p){return`S/ ${(p*curr[cur]).toFixed(2)}`}
function renderTabs(){document.getElementById('tabs').innerHTML=Object.keys(CATEGORIAS).map((k,i)=>`<div class="tab ${i?0:'active'}" onclick="selTab('${k}',this)">${CATEGORIAS[k].nom}</div>`).join('');selTab('bots',document.querySelector('.tab'))}
function selTab(k,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('productos').innerHTML=CATEGORIAS[k].data.map(p=>`<div class="card" onclick="openProduct(${p.id})"><div class="card-img" style="background-image:url('${p.imgs[0]}')"><div class="tag">Nuevo</div></div><div class="card-body"><div class="card-title">${p.nom}</div><div class="card-price">${fmt(p.precio)}</div><button class="btn-contratar">Información</button></div></div>`).join('')}
function findProduct(id){for(const k in CATEGORIAS){const f=CATEGORIAS[k].data.find(p=>p.id===id);if(f)return f}}
function openProduct(id){const p=findProduct(id);document.getElementById('productDetail').innerHTML=`<div class="product-img" style="background-image:url('${p.imgs[0]}')"></div><div class="product-title">${p.nom}</div><div class="product-price">${fmt(p.precio)}</div><div class="product-desc-title">¿Para qué sirve?</div><div class="product-desc">${p.desc}</div><ul class="product-list">${p.features.map(f=>`<li><b>✓</b> ${f}</li>`).join('')}</ul><button class="btn-comprar" onclick="buy(${p.precio},'${p.nom}')">💎 Comprar Ahora</button><button class="btn-volver-prod" onclick="showTienda()">← Volver</button>`;document.getElementById('tiendaScreen').classList.remove('active');document.getElementById('productScreen').classList.add('active')}
function showTienda(){document.getElementById('productScreen').classList.remove('active');document.getElementById('tiendaScreen').classList.add('active')}
function buy(p,n){precio=p;prodNom=n;document.getElementById('montoTotal').textContent=fmt(p);document.getElementById('userDiam').textContent=USUARIO_DIAMANTES;document.getElementById('aliasMP').textContent=ALIAS_MERCADOPAGO;document.getElementById('pagoModal').classList.add('active')}
function selectPayment(t,e){document.querySelectorAll('.payment-tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.getElementById('diamantesContent').style.display=t==='diamantes'?'block':'none';document.getElementById('mpContent').style.display=t==='mp'?'block':'none'}
function copyText(t){navigator.clipboard.writeText(t);alert('Copiado')}
function cerrarPago(){document.getElementById('pagoModal').classList.remove('active')}
document.getElementById('wspBtn').onclick=()=>{window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=Hola, pagué por ${prodNom} ${fmt(precio)}`,'_blank');cerrarPago()}
function toggleTheme(){const r=document.documentElement;const t=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',t);localStorage.setItem('theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'🌙':'☀️'}
function openCurrency(){cur=cur==='PEN'?'USD':'PEN';document.getElementById('currencyBtn').textContent=cur;renderTabs()}
document.addEventListener('DOMContentLoaded',()=>{document.querySelector('.logo').textContent=NOMBRE_TIENDA;document.querySelector('.wsp-float').href=`https://wa.me/${NUMERO_WHATSAPP}`;const savedTheme=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',savedTheme);document.getElementById('themeBtn').textContent=savedTheme==='dark'?'🌙':'☀️';renderTabs()})
</script></body></html>
