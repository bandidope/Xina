:root{
  --oscuro:#005954;

*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{color:var(--blanco);text-align:center;min-height:100vh;padding:0;background: var(--oscuro);padding-bottom:80px;}
.box{max-width:500px;margin:20px auto;background:var(--medio);border:1px solid var(--claro);border-radius:16px;padding:25px}
.verificado{background:rgba(93,193,185,0.15);border:1px solid var(--boton);border-radius:12px;padding:15px;margin:15px 20px;text-align:center}

.oferta-box{background:rgba(93,193,185,0.15);border:1px solid var(--boton);border-radius:12px;padding:12px;margin-bottom:15px;text-align:center}
.oferta-box b{color:var(--blanco);font-size:14px}
.oferta-box p{color:var(--claro);font-size:12px;margin-top:4px}
.tachado{color:var(--claro);text-decoration:line-through;font-size:20px;margin-right:8px;opacity:0.7}
header{padding:30px 20px;border-bottom:2px solid var(--boton);background:var(--medio)}
h1{color:var(--blanco);font-size:34px;letter-spacing:2px;text-shadow:0 0 12px var(--boton)}
.slogan{color:var(--claro);margin-top:5px;font-size:14px}
.container{max-width:500px;margin:auto;padding:20px}
.titulo-seccion{font-size:18px;font-weight:bold;color:var(--blanco);margin:20px 0 10px;text-align:left;border-left:3px solid var(--boton);padding-left:10px}
.card{background:var(--medio);border:1px solid var(--claro);border-radius:12px;padding:15px;margin:12px 0;text-align:left;transition:.2s;position:relative;cursor:pointer}
.card:hover{transform:scale(1.02);box-shadow:0 0 15px var(--boton)}
.tag-oferta{position:absolute;top:10px;right:10px;background:var(--rojo);color:#fff;font-size:11px;font-weight:bold;padding:4px 8px;border-radius:6px}
.nombre{font-weight:bold;font-size:16px;display:flex;align-items:center;gap:8px;color:var(--blanco)}
.precio{color:var(--blanco);font-size:18px;font-weight:bold;margin:6px 0}
.badge-img{height:20px;width:auto;border-radius:4px;vertical-align:middle}
.btn{display:block;background:var(--boton);color:var(--oscuro);padding:12px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:15px;margin-top:8px;text-align:center;transition:.2s}
.btn:hover{background:var(--claro)}
.btn-verde{background:var(--whatsapp);color:#fff}
.btn-morado{background:var(--claro);color:var(--oscuro)}
.btn-outline{background:transparent;border:1px solid var(--claro);color:var(--claro)}
.footer{color:var(--claro);font-size:12px;padding:20px;background:var(--medio)}
.sub{color:var(--claro);font-size:14px;margin-bottom:15px}
img.producto-img, img.comandos-img{width:100%;border-radius:12px;margin:15px 0;border:1px solid var(--medio)}
.precio-big{font-size:32px;color:var(--blanco);font-weight:bold;margin:15px 0}
.ahorro{color:var(--claro);font-size:13px;margin-top:-10px;margin-bottom:15px;font-weight:bold}
.lista{text-align:left;background:var(--oscuro);border-radius:10px;padding:12px;margin:15px 0;font-size:14px;line-height:1.6;color:var(--blanco)}
.metodo{background:var(--medio);border:1px solid var(--claro);border-radius:10px;padding:15px;margin:12px 0;text-align:left}
.metodo b{color:var(--blanco);font-size:16px}
.dato{font-size:15px;margin:6px 0;color:var(--blanco);letter-spacing:1px;user-select: all;}
.aviso{background:rgba(93,193,185,0.15);border-left:3px solid var(--boton);padding:10px;border-radius:6px;font-size:13px;margin:15px 0;text-align:left;color:var(--claro)}
.volver{display:block;color:var(--claro);font-size:13px;margin-top:10px;text-decoration:none}
.top-btns{display:flex;gap:8px;margin-bottom:15px}
.garantia{font-size:12px;color:var(--claro);margin-top:10px;text-align:center}
.garantia b{color:var(--blanco)}
.whatsapp-float{position:fixed;bottom:20px;right:20px;background:var(--whatsapp);color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 15px var(--whatsapp);z-index:999;text-decoration:none;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,0.7)}70%{box-shadow:0 0 0 10px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
</style>
