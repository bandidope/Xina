<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Three Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
/* THEMA ROSADO + NEGRO V48.1 */
:root[data-theme="dark"]{
  --bg:#0a0a0f; /* Negro fondo */
  --card:#1a0f1a; /* Negro + toque rosado */
  --text:#ffd1dc; /* Texto rosado claro */
  --muted:#b48ea1; /* Texto gris rosado */
  --pink:#ff3c8e; /* Rosado neón fuerte */
  --border:#3a1a2a; /* Borde rosado oscuro */
  --green:#25D366;
  --mp:#009ee5
}
:root[data-theme="light"]{
  /* Modo claro = igual que oscuro para que no se vea blanco */
  --bg:#0a0a0f;
  --card:#1a0f1a;
  --text:#ffd1dc;
  --muted:#b48ea1;
  --pink:#ff3c8e;
  --border:#3a1a2a;
  --green:#25D366;
  --mp:#009ee5
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding-bottom:70px}
header{position:sticky;top:0;background:rgba(10,10,15,.8);backdrop-filter:blur(10px);z-index:10;padding:14px 16px;border-bottom:1px solid var(--border)}
.topbar{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:1.3rem;color:var(--pink);text-shadow:0 0 10px var(--pink)}
.currency-btn{background:var(--card);border:1px solid var(--border);padding:8px 12px;border-radius:50px;font-weight:700;color:var(--pink)}
.theme-btn{background:var(--card);border:1px solid var(--border);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer}
.tabs{display:flex;gap:18px;margin-top:14px;overflow-x:auto;padding:0 16px 4px}
.tab{color:var(--muted);font-weight:600;cursor:pointer;padding-bottom:8px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--pink);border-color:var(--pink);text-shadow:0 0 8px var(--pink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:.3s}
.card:hover{border-color:var(--pink);box-shadow:0 0 20px rgba(255,60,142,.3)}
.card-img{height:140px;position:relative;overflow:hidden}
.carousel-track{display:flex;height:100%;transition:transform.8s ease}
.carousel-slide{min-width:100%;background-size:cover;background-position:center}
.tag{position:absolute;top:10px;left:10px;background:var(--pink);color:#0a0a0f;font-size:.65rem;font-weight:800;padding:4px 10px;border-radius:6px;box-shadow:0 0 10px var(--pink)}
.card-body{padding:12px}
.card-title{font-size:.9rem;font-weight:700;margin-bottom:8px}
.card-price{font-size:1.2rem;font-weight:800;color:var(--pink)}
.btn-contratar{width:100%;background:var(--pink);color:#0a0a0f;border:0;padding:12px;border-radius:10px;font-weight:800;margin-top:8px;cursor:pointer;box-shadow:0 0 15px rgba(255,60,142,.4)}
.screen{display:none}.screen.active{display:block}
.product-wrap{padding:16px;max-width:600px;margin:0 auto}
.product-img{width:100%;height:240px;background-size:cover;background-position:center;border-radius:16px;margin-bottom:16px;border:1px solid var(--border)}
.product-title{font-size:1.6rem;font-weight:800;margin-bottom:8px;color:var(--pink)}
.product-price{font-size:2rem;font-weight:800;color:var(--pink);text-shadow:0 0 10px var(--pink)}
.product-desc-title{font-size:1rem;font-weight:700;margin:16px 0 8px;color:var(--pink)}
.product-desc{color:var(--muted);line-height:1.7;margin-bottom:18px}
.product-list{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:24px;list-style:none}
.product-list li{padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:8px}
.product-list li:last-child{border:0}
.product-list li b{color:var(--pink)}
.btn-comprar{width:100%;background:var(--green);color:#fff;border:0;padding:16px;border-radius:12px;font-weight:800;margin-bottom:10px;cursor:pointer;font-size:1.05rem}
.btn-volver-prod{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);padding:16px;border-radius:12px;font-weight:800;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal.active{display:flex}
.modal-box{background:#1a0f1a;border:1.5px solid var(--pink);border-radius:20px;width:100%;max-width:360px;box-shadow:0 0 30px rgba(255,60,142,.4)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:1.2rem;font-weight:800;color:var(--pink)}
.x{background:rgba(255,255,255,.1);border:0;width:32px;height:32px;border-radius:50%;font-size:1.3rem;color:var(--muted);cursor:pointer}
.amount{font-size:2.2rem;font-weight:800;color:var(--pink);text-align:center;margin:16px 0;text-shadow:0 0 10px var(--pink)}
.payment-tabs{display:flex;gap:8px;padding:0 18px;margin-bottom:16px}
.payment-tab{flex:1;padding:12px;background:transparent;border:1px solid var(--border);border-radius:12px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.payment-tab.active{background:var(--pink);color:#0a0a0f;border-color:var(--pink);box-shadow:0 0 15px var(--pink)}
.copy-box{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);padding:12px 14px;border-radius:12px;margin:0 18px 16px;border:1px solid var(--border)}
.copy-btn{padding:8px 16px;background:var(--pink);border:0;border-radius:10px;color:#0a0a0f;font-weight:800;cursor:pointer}
.btn-wsp{width:calc(100% - 36px);background:var(--green);color:#fff;border:0;padding:14px;border-radius:12px;font-weight:800;margin:0 18px 18px;cursor:pointer;font-size:1rem}
.wsp-float{position:fixed;bottom:16px;right:16px;width:54px;height:54px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,.4)}
</style>
</head>
<body>
<header>
<div class="topbar">
<div class="logo">For Three Bot</div>
<div>
<button class="currency-btn" id="currencyBtn" onclick="openCurrency()">🌎 PEN</button>
<button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
</div>
</div>
<div class="tabs" id="tabs"></div>
</header>

<div id="tiendaScreen" class="screen active">
<div class="grid" id="productos">Cargando...</div>
</div>

<div id="productScreen" class="screen">
<div class="product-wrap" id="productDetail"></div>
</div>

<div id="pagoModal" class="modal"><div class="modal-box">
<div class="modal-header"><h3>Checkout</h3><button class="x" onclick="cerrarPago()">×</button></div>
<div class="amount" id="montoTotal">S/ 0.00</div>
<div class="payment-tabs">
<button class="payment-tab active" onclick="selectPayment('diamantes',event)">💎 Diamantes</button>
<button class="payment-tab" onclick="selectPayment('mp',event)">💙 MP</button>
</div>
<div id="diamantesContent"><div class="copy-box"><span>Usuario: <b id="userDiam">tuusuario</b></span><button class="copy-btn" onclick="copyText(USUARIO_DIAMANTES)">Copiar</button></div></div>
<div id="mpContent" style="display:none"><div class="copy-box"><span>Alias: <b id="aliasMP">tu.alias.mp</b></span><button class="copy-btn" onclick="copyText(ALIAS_MERCADOPAGO)">Copiar</button></div></div>
<button class="btn-wsp" id="wspBtn">💬 Enviar Comprobante</button>
</div></div>

<a class="wsp-float" href="https://wa.me/51936994155" target="_blank">💬</a>

<script>
// ================== ZONA EDITABLE ==================

const NUMERO_WHATSAPP = "51936994155";
const USUARIO_DIAMANTES = "tuusuario";
const ALIAS_MERCADOPAGO = "tu.alias.mp";
const TC = 3.70;

const CATEGORIAS = {bots: {nom:"Bots",data:[
    {id:1,nom:"Bot Para Grupos",precio:5,imgs:["https://images.unsplash.com/photo-1677442136019-21780ecad995?q=80&w=600","https://images.unsplash.com/photo-1614064641938-3bbee52942c7?q=80&w=600"],desc:"Bot completo para gestionar grupos 24/7.",features:["Descargas YT","IA ChatGPT","Panel Admin"]},
    {id:2,nom:"Bot VIP",precio:25,imgs:["https://images.unsplash.com/photo-1485827404703-89b55fcc595e?q=80&w=600","https://images.unsplash.com.photo-1555255707-4c4792736b81?q=80&w=600"],desc:"Bot con tu marca y logo.",features:["Nombre propio","Hosting 1GB"]},
    {id:3,nom:"Bot Antidelete",precio:8,imgs:["https://images.unsplash.com.photo-1558494949-ef010cbdcc31?q=80&w=600","https://images.unsplash.com.photo-1517694712202-14dd9538aa97?q=80&w=600"],desc:"Guarda todo lo que borran.",features:["Antidelete","Backup"]},
    {id:4,nom:"Bot +18",precio:12,imgs:["https://images.unsplash.com.photo-1622979135225-d2ba269cf1ac?q=80&w=600","https://images.unsplash.com.photo-1677442136019-21780ecad995?q=80&w=600"],desc:"Comandos +18 exclusivos.",features:["Pack IA","Privado"]},
    {id:5,nom:"Bot Economía",precio:15,imgs:["https://images.unsplash.com.photo-1555066931-4365d14bab8c?q=80&w=600","https://images.unsplash.com.photo-1544197150-b99a580bb7a8?q=80&w=600"],desc:"Sistema de monedas.",features:["Monedas","Casino"]},
    {id:6,nom:"Bot Todo en 1",precio:30,imgs:["https://images.unsplash.com.photo-1677442136019-21780ecad995?q=80&w=600","https://images.unsplash.com.photo-1614064641938-3bbee52942c7?q=80&w=600"],desc:"El bot más completo.",features:["+200 Comandos","Premium"]}
  ]},
  hosting: {nom:"Hosting",data:[
    {id:7,nom:"1GB RAM",precio:10,imgs:["https://images.unsplash.com.photo-1517694712202-14dd9538aa97?q=80&w=600","https://images.unsplash.com.photo-1558494949-ef010cbdcc31?q=80&w=600"],desc:"Para 1 bot.",features:["1GB RAM","Panel"]},
    {id:8,nom:"4GB RAM",precio:25,imgs:["https://images.unsplash.com.photo-1544197150-b99a580bb7a8?q=80&w=600","https://images.unsplash.com.photo-1555066931-4365d14bab8c?q=80&w=600"],desc:"Para 3-4 bots.",features:["4GB RAM","Prioritario"]},
    {id:9,nom:"Ilimitado",precio:120,imgs:["https://images.unsplash.com.photo-1517694712202-14dd9538aa97?q=80&w=600","https://images.unsplash.com.photo-1558494949-ef010cbdcc31?q=80&w=600"],desc:"Sin límites.",features:["16GB RAM","VIP"]}
  ]},
  cuentas: {nom:"Cuentas",data:[
    {id:10,nom:"Netflix 1M",precio:15,imgs:["https://images.unsplash.com.photo-1614064641938-3bbee52942c7?q=80&w=600","https://images.unsplash.com.photo-1622979135225-d2ba269cf1ac?q=80&w=600"],desc:"Netflix 1 mes.",features:["4K","Garantía"]},
    {id:11,nom:"Spotify 1M",precio:8,imgs:["https://images.unsplash.com.photo-1485827404703-89b55fcc595e?q=80&w=600","https://images.unsplash.com.photo-1555255707-4c4792736b81?q=80&w=600"],desc:"Sin anuncios.",features:["Sin Ads","Offline"]},
    {id:12,nom:"Disney+ 1M",precio:12,imgs:["https://images.unsplash.com.photo-1517694712202-14dd9538aa97?q=80&w=600","https://images.unsplash.com.photo-1558494949-ef010cbdcc31?q=80&w=600"],desc:"Disney+ 1 mes.",features:["4K","Estrenos"]},
    {id:13,nom:"Crunchyroll 1M",precio:10,imgs:["https://images.unsplash.com.photo-1555066931-4365d14bab8c?q=80&w=600","https://images.unsplash.com.photo-1544197150-b99a580bb7a8?q=80&w=600"],desc:"Anime sin cortes.",features:["1080p","Sin Ads"]}
  ]},
  servicios: {nom:"Servicios",data:[
    {id:14,nom:"Crear Bot",precio:50,imgs:["https://images.unsplash.com.photo-1677442136019-21780ecad995?q=80&w=600","https://images.unsplash.com.photo-1614064641938-3bbee52942c7?q=80&w=600"],desc:"Bot desde cero.",features:["Custom","24h"]},
    {id:15,nom:"Configurar Bot",precio:20,imgs:["https://images.unsplash.com.photo-1485827404703-89b55fcc595e?q=80&w=600","https://images.unsplash.com.photo-1555255707-4c4792736b81?q=80&w=600"],desc:"Te lo configuro.",features:["Instalación","Soporte"]},
    {id:16,nom:"Reparar Bot",precio:15,imgs:["https://images.unsplash.com.photo-1517694712202-14dd9538aa97?q=80&w=600","https://images.unsplash.com.photo-1558494949-ef010cbdcc31?q=80&w=600"],desc:"Arreglo tu bot.",features:["Fix 100%","Garantía"]},
    {id:17,nom:"Panel Ptero",precio:30,imgs:["https://images.unsplash.com.photo-1555066931-4365d14bab8c?q=80&w=600","https://images.unsplash.com.photo-1544197150-b99a580bb7a8?q=80&w=600"],desc:"Instalo panel.",features:["Pterodactyl","SSL"]}
  ]},
  packs: {nom:"Packs",data:[
    {id:18,nom:"Pack Inicio",precio:35,imgs:["https://images.unsplash.com.photo-1677442136019-21780ecad995?q=80&w=600","https://images.unsplash.com.photo-1614064641938-3bbee52942c7?q=80&w=600"],desc:"Bot+Hosting 1GB.",features:["Bot Grupos","1 Mes"]},
    {id:19,nom:"Pack Emprendedor",precio:65,imgs:["https://images.unsplash.com.photo-1485827404703-89b55fcc595e?q=80&w=600","https://images.unsplash.com.photo-1555255707-4c4792736b81?q=80&w=600"],desc:"Bot VIP+Hosting.",features:["Bot VIP","Logo"]},
    {id:20,nom:"Pack Agencia",precio:150,imgs:["https://images.unsplash.com.photo-1555066931-4365d14bab8c?q=80&w=600","https://images.unsplash.com.photo-1544197150-b99a580bb7a8?q=80&w=600"],desc:"Para revender.",features:["10 Bots","Web Pro"]},
    {id:21,nom:"Pack Streaming",precio:55,imgs:["https://images.unsplash.com.photo-1614064641938-3bbee52942c7?q=80&w=600","https://images.unsplash.com.photo-1622979135225-d2ba269cf1ac?q=80&w=600"],desc:"Todas las cuentas.",features:["Netflix+Spotify","Ahorra 70%"]},
    {id:22,nom:"Pack Gaming",precio:45,imgs:["https://images.unsplash.com.photo-1485827404703-89b55fcc595e?q=80&w=600","https://images.unsplash.com.photo-1555255707-4c4792736b81?q=80&w=600"],desc:"Cuentas gaming.",features:["FF Elite","COD CP"]},
    {id:23,nom:"Pack Servicios",precio:120,imgs:["https://images.unsplash.com.photo-1517694712202-14dd9538aa97?q=80&w=600","https://images.unsplash.com.photo-1558494949-ef010cbdcc31?q=80&w=600"],desc:"Todo lo que necesitas.",features:["Web+Logo+Bot","Garantía"]},
    {id:24,nom:"Pack VIP",precio:200,imgs:["https://images.unsplash.com.photo-1555066931-4365d14bab8c?q=80&w=600","https://images.unsplash.com.photo-1544197150-b99a580bb7a8?q=80&w=600"],desc:"Acceso total.",features:["Todos los bots","VPS 8GB"]},
    {id:25,nom:"Pack Reseller",precio:300,imgs:["https://images.unsplash.com.photo-1614064641938-3bbee52942c7?q=80&w=600","https://images.unsplash.com.photo-1622979135225-d2ba269cf1ac?q=80&w=600"],desc:"Para mayor.",features:["50 Bots","Panel"]}
  ]}
};
// ================== JS ==================
let cur='PEN',precio=0,prodNom='';const curr={PEN:1,USD:1/TC};
function fmt(p){return`S/ ${(p*curr[cur]).toFixed(2)}`}
function renderTabs(){document.getElementById('tabs').innerHTML=Object.keys(CATEGORIAS).map((k,i)=>`<div class="tab ${i?0:'active'}" onclick="selTab('${k}',this)">${CATEGORIAS[k].nom}</div>`).join('');selTab('bots',document.querySelector('.tab'))}
function selTab(k,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('productos').innerHTML=CATEGORIAS[k].data.map(p=>`<div class="card" onclick="openProduct(${p.id})"><div class="card-img"><div class="carousel-track" id="c${p.id}">${p.imgs.map(u=>`<div class="carousel-slide" style="background-image:url('${u}')"></div>`).join('')}</div><div class="tag">Nuevo</div></div><div class="card-body"><div class="card-title">${p.nom}</div><div class="card-price">${fmt(p.precio)}</div><button class="btn-contratar">Información</button></div></div>`).join('');setInterval(()=>{Object.values(CATEGORIAS).forEach(c=>c.data.forEach(p=>{let i=0;const t=document.getElementById(`c${p.id}`);if(t){i=(i+1)%p.imgs.length;t.style.transform=`translateX(-${i*100}%)`}}))},4000)}
function findProduct(id){for(const k in CATEGORIAS){const f=CATEGORIAS[k].data.find(p=>p.id===id);if(f)return f}}
function openProduct(id){const p=findProduct(id);document.getElementById('productDetail').innerHTML=`<div class="product-img" style="background-image:url('${p.imgs[0]}')"></div><div class="product-title">${p.nom}</div><div class="product-price">${fmt(p.precio)}</div><div class="product-desc-title">¿Para qué sirve?</div><div class="product-desc">${p.desc}</div><ul class="product-list">${p.features.map(f=>`<li><b>✓</b> ${f}</li>`).join('')}</ul><button class="btn-comprar" onclick="buy(${p.precio},'${p.nom}')">💎 Comprar Ahora</button><button class="btn-volver-prod" onclick="showTienda()">← Volver</button>`;document.getElementById('tiendaScreen').classList.remove('active');document.getElementById('productScreen').classList.add('active')}
function showTienda(){document.getElementById('productScreen').classList.remove('active');document.getElementById('tiendaScreen').classList.add('active')}
function buy(p,n){precio=p;prodNom=n;document.getElementById('montoTotal').textContent=fmt(p);document.getElementById('userDiam').textContent=USUARIO_DIAMANTES;document.getElementById('aliasMP').textContent=ALIAS_MERCADOPAGO;document.getElementById('pagoModal').classList.add('active')}
function selectPayment(t,e){document.querySelectorAll('.payment-tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.getElementById('diamantesContent').style.display=t==='diamantes'?'block':'none';document.getElementById('mpContent').style.display=t==='mp'?'block':'none'}
function copyText(t){navigator.clipboard.writeText(t);alert('Copiado')}
function cerrarPago(){document.getElementById('pagoModal').classList.remove('active')}
document.getElementById('wspBtn').onclick=()=>{window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=Hola, pagué por ${prodNom} ${fmt(precio)}`,'_blank');cerrarPago()}
function toggleTheme(){const r=document.documentElement;const t=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'🌙':'☀️'}
function openCurrency(){cur=cur==='PEN'?'USD':'PEN';document.getElementById('currencyBtn').textContent=cur;renderTabs()}
document.addEventListener('DOMContentLoaded',()=>{document.querySelector('.logo').textContent=NOMBRE_TIENDA;document.querySelector('.wsp-float').href=`https://wa.me/${NUMERO_WHATSAPP}`;renderTabs()})
</script></body></html>
